name: payment-service

# Общие настройки api и consumer: одна сборка образа, разные команды.
x-app: &app
  image: payment-service:latest
  build: .
  restart: unless-stopped
  environment:
    DATABASE_URL: postgresql+asyncpg://payments:payments@postgres:5432/payments
    RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    API_KEY: ${API_KEY:-dev-api-key}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U payments -d payments"]
      interval: 5s
      timeout: 3s
      retries: 10
    # ports: ["5432:5432"]   # раскомментируйте, чтобы запускать приложение вне Docker

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq       # фиксированное имя узла, чтобы данные переживали пересоздание контейнера
    restart: unless-stopped
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "15672:15672"        # management UI: http://localhost:15672 (guest / guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # ports: ["5672:5672"]   # AMQP наружу — только для запуска приложения вне Docker

  api:
    <<: *app
    # Миграции применяются при старте api; consumer ждёт, пока api станет healthy.
    command: sh -c "alembic upgrade head && exec uvicorn app.api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  consumer:
    <<: *app
    command: faststream run app.consumer.main:app
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"   # чтобы webhook можно было отправить на сервис, запущенный на хосте

volumes:
  pgdata:
  rabbitmq-data:
